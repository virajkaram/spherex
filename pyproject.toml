[build-system]
requires = ["setuptools", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "spherex"
version = "0.0.1"
requires-python = ">=3.10,<3.14"
dependencies = [
    "astropy",
    "numpy",
    "pandas",
    "matplotlib",
    "photutils",
    "tqdm",
    "pydantic",
    "sqlalchemy",
    "sqlalchemy_utils",
    "psycopg",
    "geoalchemy2",
    "pyarrow",
    "fastparquet",
]
